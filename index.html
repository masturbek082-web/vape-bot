    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #131416;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        
        /* Список товаров */
        .products-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 80px; }
        .product-card {
            background: #1c1d22;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #2d2f36;
            display: flex;
            flex-direction: column;
        }
        
        /* Контейнер для картинок товаров с белым фоном */
        .product-img-wrapper {
            width: 100%;
            height: 200px;
            background-color: #ffffff;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .product-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .product-price { color: #00e676; font-size: 16px; font-weight: 600; margin-bottom: 12px; }

        .flavor-select {
            width: 100%;

            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .flavor-select:focus { border-color: #00e676; outline: none; }

            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
