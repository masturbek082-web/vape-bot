<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #00ff88; --bg: #121212; --card: #1e1e1e; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 15px; margin: 0; }
        h2 { color: var(--accent); text-align: center; }
        .item { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .item h3 { margin: 0 0 10px; font-size: 18px; }
        select, input { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--accent); color: #000; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>VAPE SHOP</h2>
    
    <div class="item">
        <h3>Husky - 3500 ₸</h3>
        <select id="flavor1"><option>Двойной лед</option><option>Тропик</option></select>
    </div>

    <div class="item">
        <h3>Lost Mary - 5500 ₸</h3>
        <select id="flavor2"><option>Черника</option><option>Арбуз</option></select>
    </div>

    <div class="item">
        <input type="text" id="name" placeholder="Имя">
        <input type="text" id="phone" placeholder="Телефон">
        <input type="text" id="addr" placeholder="Адрес">
        <button onclick="sendOrder()">ОФОРМИТЬ ЗАКАЗ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendOrder() {
            let data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                addr: document.getElementById('addr').value,
                order: [
                    { item: "Husky", flavor: document.getElementById('flavor1').value },
                    { item: "Lost Mary", flavor: document.getElementById('flavor2').value }
                ]
            };
            if(!data.name || !data.phone) { alert("Заполни имя и телефон!"); return; }
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
