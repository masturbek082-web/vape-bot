<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #131416; color: white; font-family: sans-serif; padding: 20px; }
        .item { background: #1c1d22; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; background: #00e676; border: none; border-radius: 10px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Товары</h2>
    <div class="item">
        <div>Husky - 3500 ₸</div>
        <button onclick="tg.sendData('Husky')">Заказать</button>
    </div>
    <div class="item">
        <div>Lost Mary - 5500 ₸</div>
        <button onclick="tg.sendData('Lost Mary')">Заказать</button>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
