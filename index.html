<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #131416;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        
        .products-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 80px; }
        .product-card {
            background: #1c1d22;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #2d2f36;
            display: flex;
            flex-direction: column;
        }
        
        .product-img-wrapper {
            width: 100%;
            height: 200px;
            background-color: #ffffff;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .product-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .product-price { color: #00e676; font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        
        .flavor-select {
            width: 100%;
            padding: 10px;
            background: #242529;
            border: 1px solid #3d3f47;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .btn-add {
            background-color: #242529;
            color: #fff;
            border: 1px solid #00e676;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .cart-badge-btn {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background-color: #00e676;
            color: #000;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 10;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #131416;
            z-index: 20;
            padding: 20px;
            display: none;
            overflow-y: auto;
        }
        .btn-close { background: none; border: none; color: #ff5252; font-size: 18px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #1c1d22; border: 1px solid #2d2f36; border-radius: 8px; color: #fff; box-sizing: border-box; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2d2f36; }
        .total-price { font-size: 18px; font-weight: bold; text-align: right; margin-bottom: 20px; color: #00e676; }
        .btn-submit { background-color: #00e676; color: #000; width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <h2>💨 Vape Shop</h2>

    <div class="products-grid">
        <div class="product-card">
            <div class="product-img-wrapper">
                <img class="product-img" src="https://i.postimg.cc/mD8Z8yK9/1000151051.jpg" alt="Husky">
            </div>
            <div class="product-title">Жижа Husky (Двойной лед)</div>
            <div class="product-price">3500 ₸</div>
            <select id="flavor-husky" class="flavor-select">
                <option value="Киви-Мята">🥝 Киви-Мята</option>
                <option value="Тропические фрукты">🥭 Тропик микс</option>
            </select>
            <button class="btn-add" onclick="addToCart('Жижа Husky', 3500, 'flavor-husky')">🛒 В корзину</button>
        </div>

        <div class="product-card">
            <div class="product-img-wrapper">
                <img class="product-img" src="https://i.postimg.cc/K8Jp5YJ4/1000151052.jpg" alt="Lost Mary">
            </div>
            <div class="product-title">Одноразка Lost Mary</div>
            <div class="product-price">5500 ₸</div>
            <select id="flavor-mary" class="flavor-select">
                <option value="Черника-Взрыв">🫐 Черника</option>
                <option value="Арбузная Жвачка">🍉 Арбузный бабл-гам</option>
            </select>
            <button class="btn-add" onclick="addToCart('Одноразка Lost Mary', 5500, 'flavor-mary')">🛒 В корзину</button>
        </div>
    </div>

    <div id="cart-badge" class="cart-badge-btn" onclick="openCart()">
        Посмотреть корзину (<span id="cart-count">0</span>) — <span id="cart-total-badge">0</span> ₸
    </div>

    <div id="cart-modal" class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>🛒 Оформление заказа</h3>
            <button class="btn-close" onclick="closeCart()">Закрыть</button>
        </div>
        <div id="cart-items"></div>
        <div class="total-price">Итого: <span id="cart-total-modal">0</span> ₸</div>

        <div class="form-group"><input type="text" id="user-name" placeholder="Имя"></div>
        <div class="form-group"><input type="tel" id="user-phone" placeholder="Телефон"></div>
        <div class="form-group"><input type="text" id="user-address" placeholder="Адрес доставки"></div>
        <div class="form-group"><select id="payment-method"><option>Kaspi (Перевод)</option><option>Наличные</option></select></div>
        <button class="btn-submit" onclick="sendOrder()">✅ Подтвердить заказ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let cart = [];

        function addToCart(baseName, price, selectId) {
            const flavor = document.getElementById(selectId).value;
            cart.push({ name: `${baseName} (${flavor})`, price: price });
            updateCartBadge();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            if (cart.length > 0) {
                badge.style.display = 'block';
                document.getElementById('cart-count').innerText = cart.length;
                document.getElementById('cart-total-badge').innerText = cart.reduce((s, i) => s + i.price, 0);
            }
        }

        function openCart() {
            document.getElementById('cart-modal').style.display = 'block';
            let html = '';
            cart.forEach(item => html += `<div class="cart-item"><span>${item.name}</span><span>${item.price} ₸</span></div>`);
            document.getElementById('cart-items').innerHTML = html;
            document.getElementById('cart-total-modal').innerText = cart.reduce((s, i) => s + i.price, 0);
        }

        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

        function sendOrder() {
            let order = {
                name: document.getElementById('user-name').value,
                phone: document.getElementById('user-phone').value,
                address: document.getElementById('user-address').value,
                payment: document.getElementById('payment-method').value,
                items: cart.map(i => i.name).join(', '),
                total: cart.reduce((s, i) => s + i.price, 0)
            };
            tg.sendData(JSON.stringify(order));
        }
    </script>
</body>
</html>
