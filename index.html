<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .product { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        button { background: #00ff88; color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="product">Husky - 3500 ₸ <button onclick="add('Husky', 3500)">+</button></div>
    <div class="product">Lost Mary - 5500 ₸ <button onclick="add('Lost Mary', 5500)">+</button></div>
    <input id="name" placeholder="Имя" style="width:100%; padding:10px; margin:5px 0;">
    <input id="phone" placeholder="Телефон" style="width:100%; padding:10px; margin:5px 0;">
    <input id="addr" placeholder="Адрес" style="width:100%; padding:10px; margin:5px 0;">
    <button onclick="submit()" style="background:#fff; margin-top:10px;">ОФОРМИТЬ ЗАКАЗ</button>

    <script>
        let cart = [];
        let tg = window.Telegram.WebApp;
        tg.expand();
        function add(item, price) { cart.push({item, price}); alert(item + " в корзине!"); }
        function submit() {
            let data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                addr: document.getElementById('addr').value,
                cart: cart
            };
            if(!data.name || cart.length === 0) { alert("Заполни данные и добавь товар!"); return; }
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
