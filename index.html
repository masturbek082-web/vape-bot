<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #131416; color: #ffffff; padding: 20px; }
        .product { background: #1c1d22; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #00e676; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Магазин</h2>
    <div class="product">
        <p>Husky - 3500 ₸</p>
        <button onclick="tg.sendData('Husky')">Заказать Husky</button>
    </div>
    <div class="product">
        <p>Lost Mary - 5500 ₸</p>
        <button onclick="tg.sendData('Lost Mary')">Заказать Lost Mary</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
